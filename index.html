<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ПУЧКИ</title>

  <!-- BASE FIX (GitHub + Cloudflare) -->
  <script>
  (function() {
    const isGithub = location.hostname.includes("github.io");
    const base = document.createElement("base");

    if (isGithub) {
      base.href = "/pwa-ui/";
    } else {
      base.href = "/";
    }

    document.head.appendChild(base);
  })();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5f6f8">

  <!-- iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ПУЧКИ">

  <!-- Icons -->
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/app.css">
</head>

<body>
  <div class="container safeTop safeBottom">
    <header>
      <div class="leftHead">
        <button id="backBtn" class="btnGhost" style="display:none;">←</button>
        <div>
          <div class="title" id="headTitle">ПУЧКИ</div>
          <div class="crumb" id="headCrumb">Пучки + чат</div>
        </div>
      </div>

      <div class="actions" id="headActions">
        <button id="newPuchokBtn">+ Пучок</button>

        <button id="editPuchokBtn" class="iconBtn iconBtnGhost" style="display:none;" title="Переименовать">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 20h4l10.5-10.5a2 2 0 0 0 0-3L16.5 4.5a2 2 0 0 0-3 0L3 15v5Z" stroke="#111317" stroke-width="2"/>
            <path d="M13.5 6.5l4 4" stroke="#111317" stroke-width="2"/>
          </svg>
        </button>

        <button id="addMenuBtn" class="iconBtn iconBtnPrimary" style="display:none;">
          +
        </button>

        <div id="addMenu" class="menu">
          <button id="menuAddText">Текст</button>
          <button id="menuAddFile">Файл</button>
          <button id="menuAddAudio">Аудио</button>
          <button id="menuAddCode">Код</button>
          <button id="menuAddLink">Ссылка</button>
          <div class="sep"></div>
          <button id="menuDeletePuchok" class="dangerItem">Удалить пучок</button>
        </div>
      </div>
    </header>

    <div class="panel" id="mainPanel"></div>

    <div class="dock collapsed" id="chatDock">
      <div class="dockHead">
        <div>
          <div class="dockTitle">Чат</div>
          <div class="dockSmall" id="chatHint">Пишешь — отправляю в Worker</div>
        </div>
        <button id="clearChatBtn" class="btnGhost">Очистить</button>
      </div>

      <div class="dockBody" id="chat"></div>

      <div class="collapseBar" id="collapseBar">
        <div class="collapsePill"></div>
      </div>

      <div class="composer">
        <input id="input" type="text" placeholder="Напиши сообщение..." />
        <button id="send">→</button>
      </div>
    </div>
  </div>

  <input id="filePicker" type="file" style="display:none" />
  <input id="audioPicker" type="file" accept="audio/*,video/*" style="display:none" />

  <div id="modalWrap"></div>

  <script src="assets/storage.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/audio.js"></script>
</body>
</html>
